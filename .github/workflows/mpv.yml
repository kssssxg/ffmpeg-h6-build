name: Build mpv for Allwinner H6 (v4l2request)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config meson ninja-build git \
          libdrm-dev libudev-dev libv4l-dev \
          libass-dev liblcms2-dev libjpeg-dev \
          libegl1-mesa-dev libgbm-dev libwayland-dev wayland-protocols \
          libasound2-dev cmake python3-pip libshaderc-dev libunwind-dev libvulkan-dev libdisplay-info-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev

    - name: Build libdisplay-info (if apt lacks it)
      run: |
        if ! pkg-config --exists libdisplay-info; then
          git clone --depth 1 https://gitlab.freedesktop.org/emersion/libdisplay-info.git
          cd libdisplay-info
          meson setup build --buildtype=release -Dprefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
        fi

    - name: Build libplacebo v7.360.1
      run: |
        git clone --depth 1 https://github.com/haasn/libplacebo.git -b v7.360.1 libplacebo
        cd libplacebo
        meson setup build --buildtype=release \
          -Dprefix=/usr/local \
          -Dvulkan=disabled -Dopengl=disabled -Dd3d11=disabled \
          -Dshaderc=enabled -Dglslang=disabled \
          -Dtests=false -Dbench=false
        ninja -C build
        sudo ninja -C build install
        sudo ldconfig

    - name: Build FFmpeg (v4l2request) as shared dependency
      run: |
        git clone --depth 1 https://github.com/Kwiboo/FFmpeg.git -b v4l2request-2024-v2 ffmpeg-hw
        cd ffmpeg-hw
        ./configure --prefix=/opt/ffmpeg-v4l2r \
          --enable-v4l2-request --enable-libdrm --enable-libudev \
          --enable-shared --disable-static \
          --disable-programs --disable-doc --disable-debug
        make -j$(nproc)
        sudo make install

    - name: Checkout mpv (philipl v4l2request branch)
      uses: actions/checkout@v4
      with:
        repository: philipl/mpv
        ref: v4l2request
        path: mpv-src

    - name: Build mpv
      run: |
        cd mpv-src
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/opt/ffmpeg-v4l2r/lib/pkgconfig:$PKG_CONFIG_PATH
        meson setup build --buildtype=release \
          -Dgpl=true -Dlibmpv=true \
          -Dlua=disabled -Djavascript=disabled \
          -Dcdda=disabled -Ddvbin=disabled -Ddvdnav=disabled \
          -Dpulse=disabled -Djack=disabled \
          -Dvaapi=disabled -Dvdpau=disabled -Dvulkan=disabled -Dshaderc=disabled \
          -Dx11=enabled -Dxv=disabled \
          -Dgl=enabled -Dgbm=enabled -Ddrm=enabled -Dwayland=disabled \
          -Dmanpage-build=disabled -Dhtml-build=disabled -Dpdf-build=disabled
        ninja -C build

    - name: Package (mpv + ffmpeg libs + run script)
      run: |
        mkdir -p pkg/opt/ffmpeg-v4l2r/lib
        sudo cp -a /opt/ffmpeg-v4l2r/. pkg/opt/ffmpeg-v4l2r/
        # Bundle every non-base-system shared lib mpv links (libdisplay-info, libplacebo, libshaderc, etc.)
        sudo bash -c '
          set -e
          LIBDIR=pkg/opt/ffmpeg-v4l2r/lib
          ldd mpv-src/build/mpv | awk "{print \$3}" | grep -E "^/" | while read so; do
            case "$so" in
              /lib/aarch64-linux-gnu/libc.so*|/lib/aarch64-linux-gnu/libm.so*|/lib/aarch64-linux-gnu/libpthread*|/lib/aarch64-linux-gnu/libdl*|/lib/aarch64-linux-gnu/librt*|/lib/aarch64-linux-gnu/libgcc_s.so*|/lib/aarch64-linux-gnu/libstdc++.so*) ;;
              *) cp -Ln "$so" "$LIBDIR/" ;;
            esac
          done
          # also pull libdisplay-info + libplacebo explicitly wherever they live
          find /usr/local/lib /usr/lib/aarch64-linux-gnu -maxdepth 1 -name "libdisplay-info.so*" -exec cp -Ln {} "$LIBDIR/" \; 2>/dev/null || true
          find /usr/local/lib /usr/lib/aarch64-linux-gnu -maxdepth 1 -name "libplacebo.so*" -exec cp -Ln {} "$LIBDIR/" \; 2>/dev/null || true
          chown -R $(id -u):$(id -g) pkg
        '
        sudo chown -R $(id -u):$(id -g) pkg
        cp mpv-src/build/mpv pkg/
        cat > pkg/run-mpv.sh <<'EOF'
        #!/bin/sh
        # usage: ./run-mpv.sh video.mp4
        DIR="$(cd "$(dirname "$0")" && pwd)"
        export LD_LIBRARY_PATH="$DIR/opt/ffmpeg-v4l2r/lib:$LD_LIBRARY_PATH"
        exec "$DIR/mpv" --vo=gpu --gpu-context=drm --hwdec=v4l2request "$@"
        EOF
        chmod +x pkg/run-mpv.sh
        tar -C pkg -czf mpv-h6-v4l2request.tar.gz .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mpv-arm64-v4l2request
        path: mpv-h6-v4l2request.tar.gz